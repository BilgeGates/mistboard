[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fow-chess"
version = "0.1.0"
description = "Fog of war chess research, tooling, and experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "python-chess>=1.999",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]
postgres = [
  "psycopg[binary]>=3.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

