name: Prod Smoke

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

concurrency:
  group: prod-smoke-${{ github.event_name }}-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  prod-smoke:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      EXPECTED_REVISION: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Wait for Railway deploy
        run: npm run prod:wait-revision -- --expect-revision "$EXPECTED_REVISION"
      - name: Prod smoke
        run: npm run prod:smoke -- --expect-revision "$EXPECTED_REVISION"
      - name: Engine smoke
        run: npm run prod:smoke:engines

  prod-lite-smoke:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prod lite smoke
        run: npm run prod:smoke:lite

  notify-prod-failure:
    needs: [prod-smoke, prod-lite-smoke]
    if: always() && (needs.prod-smoke.result == 'failure' || needs.prod-lite-smoke.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const workflowRun = context.payload.workflow_run;
            const sha = workflowRun?.head_sha?.slice(0, 7) ?? context.sha?.slice(0, 7) ?? 'unknown';
            const commitMsg = (
              workflowRun?.display_title ??
              context.payload.head_commit?.message ??
              'scheduled prod-lite smoke'
            ).split('\n')[0];
            const smokeName = context.eventName === 'workflow_run' ? 'Prod smoke' : 'Scheduled prod-lite smoke';
            const body = [
              `${smokeName} failed on \`main\` at \`${sha}\` — ${commitMsg}`,
              '',
              `This is a deploy/health signal, not necessarily a code bug.`,
              '',
              `Run: ${runUrl}`,
            ].join('\n');

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'prod-health',
              per_page: 1,
            });

            if (existing.length > 0) {
              if (context.eventName !== 'schedule') {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing[0].number,
                  body,
                });
              }
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `${smokeName} failing`,
                body,
                labels: ['prod-health'],
              });
            }

  close-prod-health:
    needs: [prod-smoke, prod-lite-smoke]
    if: always() && (needs.prod-smoke.result == 'success' || needs.prod-lite-smoke.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const workflowRun = context.payload.workflow_run;
            const sha = workflowRun?.head_sha?.slice(0, 7) ?? context.sha.slice(0, 7);
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'prod-health',
              per_page: 20,
            });
            for (const issue of open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `✅ Prod smoke green on \`main\` at \`${sha}\` — auto-closing.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }
