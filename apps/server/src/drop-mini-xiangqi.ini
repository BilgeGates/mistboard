# Drop Mini Xiangqi — Fairy-Stockfish product variant.
#
# 7x7 Mini Xiangqi plus crazyhouse-style drops: captured pieces go to the
# captor's hand and can be dropped back onto the board. This config matches the
# Mistboard product rule DEFAULT_DROP_MINI_XIANGQI_RULES exactly:
#   - dropRegion: 'not-enemy-palace'  -> dropRegionWhite / dropRegionBlack below
#   - dropAttack: 'allow-immediate-general-threat' -> dropChecks = true
#   - reserve:    'immediate'
#
# Inherits FSF's built-in `minixiangqi` (board, movement, check/checkmate). Move
# legality was validated against packages/game's isLegalDropMiniXiangqiMove via
# scripts/variant-lab/drop-mini-xiangqi-fsf-play.ts (self-play, zero kernel-illegal
# moves). Keep this in sync with the kernel; re-run the parity harness on any edit.

[dropminixiangqi:minixiangqi]
startFen = rcnkncr/p1ppp1p/7/7/7/P1PPP1P/RCNKNCR[] w - - 0 1
pieceDrops = true
capturesToHand = true
dropChecks = true
dropRegionWhite = *1 *2 *3 *4 a5 b5 f5 g5 a6 b6 f6 g6 a7 b7 f7 g7
dropRegionBlack = *5 *6 *7 *4 a1 b1 f1 g1 a2 b2 f2 g2 a3 b3 f3 g3
pocketSize = 4
