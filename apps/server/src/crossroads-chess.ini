[dualchess:chess]
maxRank = 8
maxFile = 6
startFen = bknhcv/pppooo/6/6/6/6/OOOPPP/VCHNKB w - - 0 1
castling = false

# pawns: 2-square first move, no en passant
doubleStep = true
doubleStepRegionWhite = *2
doubleStepRegionBlack = *7
enPassantRegion = -

customPiece1 = c:mRcpR
customPiece2 = h:nN
customPiece3 = v:R

# xiangqi-style Soldier: forward-only in own half, gains sideways after the river
soldier = o
soldierPromotionRank = 5

pieceDrops = false
capturesToHand = false

# pawns promote to Queen on the far rank (soldiers just gain sideways)
promotionPieceTypes = q
promotedPieceType = p:q
promotionRegionWhite = *8
promotionRegionBlack = *1

# win: checkmate the King, or race it across to the far row
flagPiece = k
flagRegionWhite = *8
flagRegionBlack = *1
flagPieceSafe = true
stalemateValue = loss

# anti-draw: a threefold repetition is a loss for the side forced to repeat
nFoldValue = loss
