<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Play Dark Chess (Fog of War) Online | Mistboard</title>
    <meta
      name="description"
      content="Play dark chess (fog of war) online with server-enforced hidden information, ranked games, and a first-party engine."
    />
    <meta name="theme-color" content="#1f2521" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mistboard" />
    <meta property="og:title" content="Mistboard | Play Dark Chess (Fog of War) Online" />
    <meta
      property="og:description"
      content="Hidden-information chess where the server only sends what your pieces can see."
    />
    <meta property="og:url" content="https://mistboard.com/" />
    <meta property="og:image" content="https://mistboard.com/og-image.png?v=4" />
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1260" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mistboard | Play Dark Chess (Fog of War) Online" />
    <meta
      name="twitter:description"
      content="Hidden-information chess where the server only sends what your pieces can see."
    />
    <meta name="twitter:image" content="https://mistboard.com/og-image.png?v=4" />
    <script>
      (() => {
        const key = "mistboard.siteTheme";
        const allowed = new Set(["system", "light", "dark"]);
        let stored = "system";
        try {
          const value = window.localStorage.getItem(key);
          if (allowed.has(value)) stored = value;
        } catch {
          /* localStorage may be unavailable in private contexts. */
        }
        const prefersDark = window.matchMedia?.("(prefers-color-scheme: dark)").matches === true;
        const resolved = stored === "dark" || (stored === "system" && prefersDark) ? "dark" : "light";
        document.documentElement.dataset.siteTheme = stored;
        document.documentElement.dataset.effectiveTheme = resolved;
        document.documentElement.style.colorScheme = resolved;
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute("content", resolved === "dark" ? "#121615" : "#ebefee");
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
