# Drop Mini Xiangqi Fairy-Stockfish lab variants.
#
# These are engine probes, not Mistboard product definitions. They inherit from
# FSF's built-in minixiangqi and use orthodox check semantics, so they are close
# enough for balance probes while remaining lab-only.

[dropminixiangqi-wild:minixiangqi]
startFen = rcnkncr/p1ppp1p/7/7/7/P1PPP1P/RCNKNCR[] w - - 0 1
pieceDrops = true
capturesToHand = true
dropChecks = true
pocketSize = 4

[dropminixiangqi-no-enemy-palace:minixiangqi]
startFen = rcnkncr/p1ppp1p/7/7/7/P1PPP1P/RCNKNCR[] w - - 0 1
pieceDrops = true
capturesToHand = true
dropChecks = true
dropRegionWhite = *1 *2 *3 *4 a5 b5 f5 g5 a6 b6 f6 g6 a7 b7 f7 g7
dropRegionBlack = *5 *6 *7 *4 a1 b1 f1 g1 a2 b2 f2 g2 a3 b3 f3 g3
pocketSize = 4

[dropminixiangqi-no-threat:minixiangqi]
startFen = rcnkncr/p1ppp1p/7/7/7/P1PPP1P/RCNKNCR[] w - - 0 1
pieceDrops = true
capturesToHand = true
dropChecks = false
pocketSize = 4

[dropminixiangqi-home:minixiangqi]
startFen = rcnkncr/p1ppp1p/7/7/7/P1PPP1P/RCNKNCR[] w - - 0 1
pieceDrops = true
capturesToHand = true
dropChecks = false
dropRegionWhite = *1 *2 *3
dropRegionBlack = *5 *6 *7
pocketSize = 4
