# Fortress Xiangqi — "RIVER SOLDIER" (the pre-2026-07-04 shipped rule, STUDY ONLY).
#
# Reconstructs the ORIGINAL river-gated soldier that shipped before the veteran
# switch: forward-only (fW) on the own half, gaining the sideways step only after
# crossing the river (soldierPromotionRank = 5). Used by
# scripts/variant-lab/fortress-soldier-study.ts to A/B this against the CURRENT
# shipped veteran soldier (apps/server/src/fortress-xiangqi.ini, customPiece6=p:fsW).
# NOT a product variant; NOT wired into the server registry.
#
# The ONLY diff vs the current base ini is the soldier block (soldier = p +
# soldierPromotionRank = 5 replaces customPiece6 = p:fsW).

[fortressxiangqiriver:minixiangqi]
maxRank = 8
startFen = rnceakq/pp1p1pp/7/7/7/7/PP1P1PP/QKAECNR w - - 0 1

horse = n
customPiece1 = r:R
customPiece2 = c:mRcpR
customPiece3 = a:F
customPiece4 = e:nA
customPiece5 = q:WF
# RIVER SOLDIER: forward-only on the own half; +sideways only after the river.
soldier = p
soldierPromotionRank = 5
mandatoryPiecePromotion = false

mobilityRegionWhiteKing = a1 b1 c1 a2 b2 c2 a3 b3 c3
mobilityRegionBlackKing = e6 f6 g6 e7 f7 g7 e8 f8 g8
mobilityRegionWhiteCustomPiece3 = a1 b1 c1 a2 b2 c2 a3 b3 c3
mobilityRegionBlackCustomPiece3 = e6 f6 g6 e7 f7 g7 e8 f8 g8
mobilityRegionWhiteCustomPiece4 = *1 *2 *3 *4
mobilityRegionBlackCustomPiece4 = *5 *6 *7 *8

pieceDrops = true
capturesToHand = true
dropChecks = true
pocketSize = 16
whiteDropRegion = *1 *2 *3 *4 *5 *6 *7 *8
blackDropRegion = *1 *2 *3 *4 *5 *6 *7 *8
dropRegionWhite = *1 *2 *3 *4 *5 *6 *7 *8
dropRegionBlack = *1 *2 *3 *4 *5 *6 *7 *8

stalemateValue = loss
chasingRule = axf
