# Railway / Nixpacks build config.
#
# Builds the full monorepo (game → server → web) and runs apps/server,
# which serves both the static apps/web/dist bundle and the WebSocket
# upgrade on $PORT. Postgres is required in prod (DATABASE_URL injected
# by the Railway Postgres plugin); without it, apps/server falls back
# to in-memory rooms.
#
# The engine implementation lives in the private mistboard-engine repo and is
# installed only for engine-worker builds. Web must not clone or install it.
# Set MISTBOARD_BUILD_ENGINE=1 on engine-worker only.

providers = ["...", "python"]

[phases.setup]
nixPkgs = ["...", "nodejs_22", "stockfish", "openssh", "git"]

[phases.install]
cmds = [
  'if [ "${MISTBOARD_BUILD_ENGINE:-0}" = "1" ]; then mkdir -p ~/.ssh && chmod 700 ~/.ssh; else echo MISTBOARD_BUILD_ENGINE_not_1_skipping_private_engine_checkout; fi',
  'if [ "${MISTBOARD_BUILD_ENGINE:-0}" = "1" ]; then printf "%s\n" "$MISTBOARD_ENGINE_DEPLOY_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519; fi',
  'if [ "${MISTBOARD_BUILD_ENGINE:-0}" = "1" ]; then ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null; fi',
  'if [ "${MISTBOARD_BUILD_ENGINE:-0}" = "1" ]; then git clone --depth 1 git@github.com:brianhliou/mistboard-engine.git "${MISTBOARD_ENGINE_DIR:-/mistboard-engine}"; fi',
  'npm ci',
  'if [ "${MISTBOARD_BUILD_ENGINE:-0}" = "1" ]; then python -m pip install "${MISTBOARD_ENGINE_DIR:-/mistboard-engine}[postgres]"; fi',
]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm start"
